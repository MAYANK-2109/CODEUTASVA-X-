[project]
name = "codeutsava-backend"
version = "0.1.0"
description = "Multi-agent financial intelligence backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "yfinance>=1.7.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "anthropic>=1.11.0",
    "vadersentiment>=3.3.2",
    "python-multipart>=0.0.32",
    "pinecone>=10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
